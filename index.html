<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meditace v Ášrámu</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: #1e293b;
            padding: 2rem;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 90%;
        }
        img {
            width: 200px;
            height: 200px;
            border-radius: 1rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 2rem; }
        .btn {
            display: block;
            background: #3b82f6;
            color: white;
            text-decoration: none;
            padding: 1rem;
            border-radius: 0.75rem;
            font-weight: bold;
            margin-bottom: 1rem;
            transition: transform 0.2s;
        }
        .btn:active { transform: scale(0.98); }
        .btn-rss { background: #f97316; }
        .footer { font-size: 0.7rem; color: #475569; margin-top: 2rem; }
    </style>
</head>
<body>
    <div class="card">
        <img src="Shiva.png" alt="Meditace v Ášrámu">
        <h1>Meditace v Ášrámu</h1>
        <p>Soukromý kanál řízených meditací se Sankalpou a instrukcemi.</p>
        
        <a href="podcast://kocandrle69.github.io/meditace-podcast/podcast.xml" class="btn">Odebírat v Apple Podcasts</a>
        
        <a href="https://kocandrle69.github.io/meditace-podcast/podcast.xml" class="btn btn-rss" onclick="copyRSS(event)">Kopírovat RSS odkaz</a>
        
        <div class="footer">Spravováno přes GitHub Pages</div>
    </div>

    <script>
        function copyRSS(e) {
            e.preventDefault();
            const url = "https://kocandrle69.github.io/meditace-podcast/podcast.xml";
            navigator.clipboard.writeText(url).then(() => {
                alert("RSS odkaz byl zkopírován do schránky.");
            });
        }
    </script>
</body>
</html>
